name: Continuous Integration

# Rename workflow run name to include the triggering event and branch/commit.
run-name: >-
  CI (${{ github.event_name }}) on
  ${{ github.head_ref || github.ref_name }} ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

env:
  PYTEST_ON_CI: True

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-packages-toop-runner:
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Only one job of matrix:
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
      fail-fast: false
      matrix:
        include:
          - package: dc_solver_pkg
          - package: topology_optimizer_pkg
          - package: importer_pkg
    runs-on: Runner-ToOp-Projects
    steps:
      - name: Check out repository code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Run package tests
        uses: ./.github/actions/run-package-tests
        with:
          package: ${{ matrix.package }}
          workers: auto

  test-packages-github-runner:
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: grid_helpers_pkg
          - package: contingency_analysis_pkg
          - package: interfaces_pkg
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Run package tests
        uses: ./.github/actions/run-package-tests
        with:
          package: ${{ matrix.package }}
          workers: auto

  code-quality-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Python and install dependencies
        uses: ./.github/actions/setup-python

      - name: set PY
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Configure pre-commit cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit hooks
        run: uv run pre-commit install

      - name: Run code quality checks
        run: SKIP=no-commit-to-branch uv run pre-commit run --all-files

  license-headers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: License Header Check
        uses: B1NARY-GR0UP/nwa@3e1823c61ba2818a156c77b4eedc7905d6a8557c
        with:
          version: latest # (optional) version of nwa to use; default: latest
          cmd: check # (optional) command to execute; options: `check`, `add`, `update`, `remove`; default: check
          path: .nwa-config.yaml # (optional) configuration file path; default: .nwa-config.yaml

  test-docs-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Python and install dependencies
        uses: ./.github/actions/setup-python
        with:
          sync-args: "--only-group doc --frozen"

      - name: Conditional Deployment
        run: uv run mkdocs build

  test-example-notebooks:
    permissions:
      contents: read
    runs-on:
      labels: Runner-ToOp-Projects
    timeout-minutes: 10
    env:
      UV_PROJECT: ./
    steps:
      - name: Check out repository code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Python and install dependencies
        uses: ./.github/actions/setup-python

      - name: Verify jupyter installation
        run: uv run jupyter --version

      - name: Test example notebooks
        run: uv run pytest -n auto --dist loadgroup notebooks/tests

  ci-summary:
    needs: [test-packages-toop-runner, test-packages-github-runner]
    if: success()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: .
          merge-multiple: true

      - name: Setup Python and install dependencies
        uses: ./.github/actions/setup-python
        with:
          sync-args: "--only-group ci --frozen"

      - name: Merge coverage reports
        run: |
          uv run --no-sync coverage combine coverage-data-*
          uv run --no-sync coverage report --format=markdown > coverage.md
          uv run --no-sync coverage xml -o coverage.xml

      - name: Publish CI summary
        run: |
          {
            echo "## CI"
            echo
            echo "[Open commit ${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo
            echo "## Combined test coverage"
            echo
            cat coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-combined
          path: coverage.xml
          retention-days: 7

  ci-success-check:
    needs:
      [
        code-quality-checks,
        ci-summary,
        license-headers,
        test-docs-build,
        test-example-notebooks,
        test-packages-github-runner,
        test-packages-toop-runner,
      ]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check all job results
        run: |
          echo "Code Quality: ${{ needs.code-quality-checks.result }}"
          echo "CI Summary: ${{ needs.ci-summary.result }}"
          echo "License Headers: ${{ needs.license-headers.result }}"
          echo "Test Docs Build: ${{ needs.test-docs-build.result }}"
          echo "Test Example Notebooks: ${{ needs.test-example-notebooks.result }}"
          echo "Test Packages (GitHub Runner): ${{ needs.test-packages-github-runner.result }}"
          echo "Test Packages (ToOp Runner): ${{ needs.test-packages-toop-runner.result }}"

          if [[ "${{ needs.code-quality-checks.result }}" != "success" ]] || \
             [[ "${{ needs.ci-summary.result }}" != "success" ]] || \
             [[ "${{ needs.license-headers.result }}" != "success" ]] || \
             [[ "${{ needs.test-docs-build.result }}" != "success" ]] || \
             [[ "${{ needs.test-example-notebooks.result }}" != "success" ]] || \
             [[ "${{ needs.test-packages-github-runner.result }}" != "success" ]] || \
             [[ "${{ needs.test-packages-toop-runner.result }}" != "success" ]]; then
            echo "One or more CI jobs failed, were cancelled, or skipped. Marking as failed."
            exit 1
          fi
          echo "All CI jobs succeeded."

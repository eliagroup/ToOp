name: docs

on:
  workflow_dispatch:
  # The docs list published GitHub releases, so they are built once a release is
  # published, not when the release workflow has merely pushed its tag.
  release:
    types:
      - published

permissions: {}

env:
  CHANGELOG_FILE: "docs/changelog.md"

concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  # A release event runs on the release tag, but the docs environment only
  # deploys from main. So hand over to a workflow_dispatch run on main, the one
  # event the GITHUB_TOKEN is allowed to trigger.
  dispatch-on-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      actions: write
    steps:
      - name: Start the docs build on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "Release $RELEASE_TAG was published, building the docs from main"
          gh workflow run docs.yaml --repo "$GITHUB_REPOSITORY" --ref main

  publish-docs:
    runs-on: ubuntu-latest
    environment: docs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0 # fetch full history
          fetch-tags: true # ensure tags are fetched
          persist-credentials: true # keeps GITHUB_TOKEN set up for pushing back to remote
          ssh-key: ${{ secrets.RELEASE_KEY }}

      - name: Configure git profile
        uses: ./.github/actions/configure-git-profile

      - name: "Set up Python"
        uses: ./.github/actions/setup-python

      # Staged outside the work tree because the build loop below checks out
      # each release tag, and older tags do not contain this script.
      - name: Stage the architecture app builder
        run: |
          set -euo pipefail
          cp scripts/build_architecture_app.sh "$RUNNER_TEMP/build_architecture_app.sh"
          chmod +x "$RUNNER_TEMP/build_architecture_app.sh"

      - name: Build documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Getting stable releases"
          releases_json=$(gh release list --exclude-drafts --exclude-pre-releases --limit 200 --json tagName)
          latest_tag=$(echo "$releases_json" | jq -r '.[0].tagName // empty')

          if [ -z "$latest_tag" ]; then
            echo "No stable GitHub releases found. Exiting without deployment."
            exit 0
          fi

          echo "Latest stable release tag: $latest_tag"
          echo "$releases_json" | jq -r 'reverse | .[].tagName' | while IFS= read -r release_tag; do
              [ -z "$release_tag" ] && continue

              echo "Building documentation for tag $release_tag"

              echo "Checking out commit tag"
              git checkout --force "$release_tag"

              # Each tag brings its own doc group: older releases build with MkDocs and
              # upstream mike, newer ones with Zensical and the Zensical fork of mike.
              echo "Syncing documentation dependencies for tag $release_tag"
              uv sync --frozen --only-group doc

              mkdir -p "$(dirname "$CHANGELOG_FILE")"

              echo "Adding changelog to the docs nav"
              # NOTE:
              # - We are in a detached HEAD after checking out the tag above.
              # - The change to mkdocs.yml is temporary and only used for this build. Releases
              #   built with Zensical read the same file, so this works for both builders.
              # - It is discarded when the workflow checks out the next tag or the gh-pages branch.
              # - We intentionally mutate mkdocs.yml in-place here instead of maintaining a separate config file.
              echo "  - Changelog: changelog.md" >> mkdocs.yml

              echo "Fetching release url"
              url=$(gh release view "$release_tag" --json url | jq -r '.url')
              printf '# [%s](%s)\n' "$release_tag" "$url" > "$CHANGELOG_FILE"

              echo "Fetching release body"
              gh release view "$release_tag" --json body | jq -r '.body' >> "$CHANGELOG_FILE"

              if [ "$release_tag" = "$latest_tag" ]; then
                # Only the newest release carries the interactive app: it is
                # 6 MB of static assets, and shipping a copy per release would
                # grow the gh-pages branch without bound.
                echo "Building the interactive architecture app for $release_tag"
                "$RUNNER_TEMP/build_architecture_app.sh"

                echo "Writing to gh-pages branch with latest alias"
                uv run mike deploy --update-aliases "$release_tag" latest
              else
                echo "Writing to gh-pages branch"
                uv run mike deploy "$release_tag"
              fi
          done

      - name: Set default version tag
        run: |
          uv run mike set-default latest --allow-empty

      - name: Publish documentation
        run: |
          git checkout gh-pages --force || git checkout -b gh-pages origin/gh-pages
          git push origin gh-pages

      - name: Restore initial checkout for post-job cleanup
        if: always()
        run: |
          git checkout --force "$GITHUB_SHA"

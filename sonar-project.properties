# SonarQube Project Configuration
sonar.projectKey=gras-gridanalysis-toop-engine
sonar.projectName=gras-gridanalysis-toop-engine
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=packages
sonar.tests=packages

# Python-specific settings
sonar.language=py
sonar.python.version=3.11

# Test file patterns
sonar.test.inclusions=**/*_test.py,**/test_*.py,**/tests/**,**/*_tests/**,**/tests/**,**/tests/**,**/tests/**

# Exclusions - files not to analyze for code quality
sonar.exclusions=**/tests/**,**/*_tests/**,**/test_*.py,**/*_test.py,**/tests/**,**/tests/**,**/tests/**,**/__pycache__/**,**/*.pyc,**/notebooks/**,**/data/**,**/docs/**

# Source encoding
sonar.sourceEncoding=UTF-8

# DC-first study: all modes receive every seed and share this exact configuration.
# One study per grid: edit identifier and source_path under grids; output_directory follows the identifier.

# Fixed per-grid directory so prepared_grids/ is reused; results under runs/ are overwritten on each start.
output_directory: ${oc.env:PWD}/data/IT/results/parent_selection/${grids.0.identifier}
show_progress: true
stop_on_error: false

descriptor_resolution:
  # Set to [] because case1888rte has no PST that can change tap; add pst_activated for grids with movable PSTs.
  auto_metrics: []
  max_logical_cells: 100000

grids:
  # - identifier: grid_node_breaker
  #   source_path: ${oc.env:PWD}/data/grid_node_breaker/grid.xiidm
  #   grid_type: powsybl

  - identifier: case_ACTIVSg200
    source_path: ${oc.env:PWD}/data/IT/case_ACTIVSg200.xiidm
    grid_type: powsybl

modes:
  - uniform
  # - uniform_cell
  - ucb_snapshot
  - greedy

# Every mode is run with every seed, enabling paired comparisons against UNIi.
seeds: [101, 103, 105, 107, 108]

ga:
  runtime_seconds: 10
  # Run more JIT iterations before CPU trajectory recording to reduce synchronization overhead.
  iterations_per_epoch: 8
  random_topo_prob: 0.1
  # Requires at least one controllable PST; must be false for case_ACTIVSg200 and case_ACTIVSg500.
  enable_nodal_inj_optim: false
  pst_mutation_sigma: 1.0
  pst_mutation_probability: 0.2
  pst_reset_probability: 0.0
  n_worst_contingencies: 2
  target_metrics:
    - [overload_energy_artificial_limit_n_0, 1]
    - [overload_energy_artificial_limit_n_1, 1]
    - [switching_distance, 5]
    - [disconnected_branches, 50]
    - [split_subs, 100]
  observed_metrics:
    - max_flow_artificial_limit_n_0
    - overload_energy_artificial_limit_n_0
    - max_flow_artificial_limit_n_1
    - critical_branch_count_artificial_limit_n_1
    - overload_energy_artificial_limit_n_1
    - split_subs
    - switching_distance
  me_descriptors:
    - metric: switching_distance
      num_cells: 20
    - metric: split_subs
      num_cells: 5
    - metric: disconnected_branches
      num_cells: 4
  cell_depth: 4
  ucb_selection_block_size: 16 # used by ucb_batched
  ucb_snapshot_temperature: 0.1

lf:
  max_num_splits: 4
  max_num_disconnections: 3
  # T4 baseline: increase parallel DC candidates per JAX invocation; tune upward if memory permits.
  batch_size: 64
  distributed: false

preprocessing:
  action_set_clip: 1024
  initial_loadflow_processes: 1
  preprocess_bb_outages: false

ac_validation:
  enabled: false
  k_best_topos: 5
  n_processes: 1
  critical_voltage_jump_percent: 5.0
  critical_va_diff_degree: 20.0

hydra:
  run:
    dir: ${output_directory}/hydra
  job:
    chdir: false
